name: Import complete portal source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace partial upload with complete source
        shell: bash
        run: |
          cat apex-source-upload.b64.part-*.txt | base64 --decode > /tmp/apex-source-upload.tar.gz
          git rm -rf .
          tar -xzf /tmp/apex-source-upload.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Apex Partner Portal source upload"
          git push origin main
